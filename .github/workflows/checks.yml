name: Check site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run site checks
        run: uv run python scripts/check_site.py

      - name: Run external link checks
        if: github.event_name != 'pull_request'
        run: uv run python scripts/check_site.py --external
