# Builds nothing (this is a static site) and deploys it to GitHub Pages.
#
# One-time setup in the repository on GitHub:
#   1. Settings > Pages > Build and deployment > Source = "GitHub Actions".
#   2. Settings > Pages > Custom domain = "torchio.org" (writes/keeps the CNAME
#      file). Point the apex DNS at GitHub Pages (A/AAAA records or a
#      CNAME-flattened record to torchio-project.github.io).
#   3. Enable "Enforce HTTPS" once the certificate is issued.

name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
