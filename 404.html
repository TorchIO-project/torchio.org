<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | TorchIO</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#812ce5" />
    <link rel="icon" href="assets/img/favicon.ico" sizes="any" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <style>
      .nf {
        min-height: 80vh;
        display: grid;
        place-content: center;
        text-align: center;
        gap: 18px;
      }
      .nf .code {
        font-weight: 800;
        font-size: clamp(4rem, 18vw, 9rem);
        line-height: 1;
        background: linear-gradient(120deg, var(--brand), var(--brand-soft));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .nf p {
        color: var(--text-muted);
        font-size: 1.1rem;
      }
      .nf .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <main class="container nf">
      <div class="code">404</div>
      <h1>This page took a wrong turn.</h1>
      <p>The page you’re looking for doesn’t exist (or has moved).</p>
      <div class="actions">
        <a class="btn btn-primary" href="/">Back home</a>
        <a class="btn btn-ghost" href="https://docs.torchio.org">Documentation</a>
      </div>
    </main>
  </body>
</html>
